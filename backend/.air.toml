# Air configuration file for hot reload in development
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "tmp\\main.exe"
  cmd = "go build -o tmp\\main.exe ./cmd/api"
  delay = 1000
  exclude_ext = ["so", "o", "a", "dll", "dylib", "exe", "exe~", "colorful", "test.js"]
  exclude_patterns = ["assets", "tmp"]
  exclude_regex = ["_test.go"]
  exclude_tests = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app_output = ""
  build_log_cmd_output = ""
  main_attr = "bold blue"
  main_output = ""
  time_attr = "bold black"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
