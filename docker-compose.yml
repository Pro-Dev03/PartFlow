# PartFlow Docker Compose Configuration
# هذا الملف للتطوير المحلي فقط
# للنشر على Render، استخدم render.yaml
# راجع docs/DEPLOYMENT_RENDER.md للتفاصيل
# قبل التشغيل: انسخ .env.example إلى .env وضع قيمًا سرية حقيقية.
# لا توجد قيم افتراضية للأسرار عمدًا؛ Compose سيتوقف إذا لم تُضبط.

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - APP_ENV=development
      - APP_PORT=8080
    depends_on:
      - postgres
      - redis
      - searxng
    networks:
      - app-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # PostgreSQL (لتطوير محلي - على Render استخدم Managed PostgreSQL)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-partflow}
      - POSTGRES_USER=${POSTGRES_USER:-partflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Background Worker
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  # Redis (لتطوير محلي - على Render استخدم Managed Redis)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Internal free web search for barcode fallback. No external API key.
  searxng:
    image: searxng/searxng:latest
    expose:
      - "8080"
    volumes:
      - ./docker/searxng:/etc/searxng
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
