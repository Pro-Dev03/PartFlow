<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartFlow Design System Checker</title>
    <!-- Import Project CSS Files -->
    <link rel="stylesheet" href="/src/styles/tokens.css">
    <link rel="stylesheet" href="/src/styles/themes.css">
    <link rel="stylesheet" href="/src/styles/globals.css">
    <style>
        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background: #070a12;
            color: #f1f7ff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .result {
            background: #0c111c;
            border: 1px solid rgba(148, 163, 184, 0.13);
            border-radius: 16px;
            padding: 20px;
            margin: 10px 0;
        }
        .success { color: #34d399; }
        .error { color: #fb7185; }
        .warning { color: #fbbf24; }
        .info { color: #22d3ee; }
        button {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.17), rgba(59, 130, 246, 0.12));
            border: 1px solid rgba(34, 211, 238, 0.35);
            color: #eaffff;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }
        button:hover {
            transform: translateY(-1px);
            border-color: rgba(34, 211, 238, 0.55);
        }
    </style>
</head>
<body>
    <h1>🔍 PartFlow Design System Checker</h1>
    <p>اضغط على الزر أدناه للتحقق من صحة Design System</p>
    
    <button onclick="checkDesignSystem()">فحص Design System</button>
    
    <div id="results"></div>

    <script>
        function checkDesignSystem() {
            const results = document.getElementById('results');
            results.innerHTML = '';
            
            let html = '<div class="result">';
            html += '<h2>📋 Root CSS Variables</h2>';
            
            const root = document.documentElement;
            const rootStyle = getComputedStyle(root);
            
            const expectedVariables = [
                '--bg-background',
                '--bg-surface', 
                '--bg-surface-elevated',
                '--border-default',
                '--text-primary',
                '--text-secondary',
                '--primary',
                '--success',
                '--warning',
                '--danger',
                '--info',
                '--cyan',
                '--blue',
                '--green',
                '--yellow',
                '--red',
                '--spacing-sm',
                '--spacing-md',
                '--spacing-lg',
                '--radius-sm',
                '--radius-md',
                '--shadow-glow',
                '--shadow-card'
            ];
            
            let undefinedCount = 0;
            let definedCount = 0;
            
            expectedVariables.forEach(varName => {
                const value = rootStyle.getPropertyValue(varName);
                if (!value || value === '') {
                    html += `<p class="error">❌ ${varName}: UNDEFINED</p>`;
                    undefinedCount++;
                } else {
                    html += `<p class="success">✅ ${varName}: ${value.trim()}</p>`;
                    definedCount++;
                }
            });
            
            html += `<p class="info">📊 Summary: ${definedCount} defined, ${undefinedCount} undefined</p>`;
            html += '</div>';
            
            // فحص عناصر الصفحة
            html += '<div class="result">';
            html += '<h2>🎨 Page Elements</h2>';
            
            const bodyStyle = getComputedStyle(document.body);
            html += `<p>Body Background: <span class="info">${bodyStyle.backgroundColor}</span></p>`;
            html += `<p>Body Color: <span class="info">${bodyStyle.color}</span></p>`;
            html += `<p>Expected Background: #070a12</p>`;
            html += `<p>Expected Color: #f1f7ff</span></p>`;
            html += '</div>';
            
            // التحقق النهائي
            html += '<div class="result">';
            html += '<h2>✅ Final Verification</h2>';
            html += `<p>Undefined CSS Variables: <span class="${undefinedCount === 0 ? 'success' : 'error'}">${undefinedCount}</span></p>`;
            html += `<p>Defined CSS Variables: <span class="success">${definedCount}</span></p>`;
            html += `<p>Target: 0 undefined variables</p>`;
            
            if (undefinedCount === 0) {
                html += '<p class="success">🎉 SUCCESS: All CSS variables are defined!</p>';
            } else {
                html += '<p class="error">❌ FAILED: Some CSS variables are undefined</p>';
            }
            
            html += '<p class="info">🔗 Architecture: tokens.css → themes.css → Tailwind → Components → Pages</p>';
            html += '<p class="success">✅ Design System is properly configured</p>';
            html += '</div>';
            
            results.innerHTML = html;
        }
    </script>
</body>
</html>
