<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PartFlow - Smart Computer Store Management System" />
    <title>PartFlow - إدارة محلك بطريقة أذكى</title>
    
    <!-- Fonts - حسب التقرير النهائي لتصميم وواجهة وتجربة المستخدم -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Fallback fonts for file:// protocol when Google Fonts fail to load */
      html { font-family: 'IBM Plex Sans Arabic', 'Cairo', Tahoma, Arial, sans-serif !important; }
      body { color: #e2e8f0; background: #0f172a; }
      #root { opacity: 1 !important; visibility: visible !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Loading overlay to prevent flash of unstyled content -->
    <div id="loading-overlay" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    ">
      <div style="
        color: #22d3ee;
        font-family: 'IBM Plex Sans Arabic', 'Cairo', sans-serif;
        font-size: 1.5rem;
        font-weight: 600;
      ">
        PartFlow...
      </div>
    </div>
    
    <script>
      // Remove loading overlay when React mounts
      window.addEventListener('load', function() {
        const overlay = document.getElementById('loading-overlay');
        if (overlay) {
          overlay.style.opacity = '0';
          setTimeout(() => overlay.remove(), 300);
        }
      });
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
