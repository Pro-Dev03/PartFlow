services:
  # PostgreSQL Database
  - type: pserv
    name: partflow-db
    plan: free
    databaseName: partflow
    databaseVersion: 15
    ipAllowList: []

  # Redis (optional - for background jobs)
  - type: pserv
    name: partflow-redis
    plan: free
    maxconnections: 20
    allowTraffic:
      - type: private

  # Backend API
  - type: web
    name: partflow-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: partflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: pserv
          name: partflow-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: 8080

  # Background Worker
  - type: worker
    name: partflow-worker
    env: docker
    plan: free
    dockerfilePath: ./worker/Dockerfile
    # Build the production worker from backend/cmd/worker.  The old
    # ./worker context contained a legacy stub and never ran the real jobs.
    dockerContext: .
    region: oregon
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: partflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: pserv
          name: partflow-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
