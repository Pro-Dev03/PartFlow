services:
  # PostgreSQL Database
  - type: pserv
    name: partflow-db
    plan: free
    databaseName: partflow
    databaseVersion: 15
    ipAllowList: []

  # Render Key Value (optional; the current worker does not require it)
  - type: keyvalue
    name: partflow-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # Backend API
  - type: web
    name: partflow-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: partflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: partflow-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_MODE
        value: release
      - key: PARTFLOW_ADMIN_EMAILS
        sync: false
      - key: PARTFLOW_ALLOW_PUBLIC_REGISTRATION
        value: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: 8080

  # Background Worker
  - type: worker
    name: partflow-worker
    env: docker
    plan: free
    dockerfilePath: ./worker/Dockerfile
    # The Dockerfile uses the repository root as context to build
    # backend/cmd/worker, the single supported Worker implementation.
    dockerContext: .
    region: oregon
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: partflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: partflow-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: partflow-backend
          envVarKey: JWT_SECRET
      - key: SERVER_MODE
        value: release
      - key: LOG_LEVEL
        value: info
