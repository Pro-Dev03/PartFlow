use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - bing

general:
  debug: false
  instance_name: "PartFlow SearXNG"

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "partflow-local-searxng-secret-change-me"
  limiter: false
  public_instance: false

search:
  safe_search: 1
  formats:
    - html
    - json

engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: bing
    engine: bing
    shortcut: bi